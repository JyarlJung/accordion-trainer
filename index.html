<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accordion Trainer</title>
  </head>
  <body>
    <header id="toolbar">
      <div class="bar transport">
        <button id="play" class="primary" title="Space">▶</button>
        <input type="range" id="seek" min="0" max="1000" value="0" />
        <span id="time" class="mono">0:00 / 0:00</span>
        <span class="sep"></span>
        <label>속도 <input type="range" id="rate" min="0.25" max="1.5" step="0.05" value="1" /></label>
        <span id="rateLabel" class="mono">100%</span>
        <span class="sep"></span>
        <span class="group" title="마디 단위로 구간을 반복합니다">구간반복
          <button id="loopA" title="구간 시작">A</button>
          <button id="loopB" title="구간 끝">B</button>
          <button id="loopClear" title="구간 해제">✕</button>
        </span>
        <span class="sep"></span>
        <span class="group">
          <label title="메트로놈 볼륨. 0%면 꺼집니다. 마디 첫 박은 높은 소리">메트로놈 <input type="range" id="metronome" min="0" max="1" step="0.1" value="0" /></label>
          <select id="metronomeUnit" title="클릭 간격: 2분은 두 박마다(원이 한 번 왕복할 때), 4분은 박마다(원이 끝에 닿을 때), 8분은 박 사이에도 작은 소리로">
            <option value="half">2분</option>
            <option value="quarter" selected>4분</option>
            <option value="eighth">8분</option>
          </select>
          <span id="beatSwing" title="원이 박마다 양 끝을 오갑니다. 오른손 건반을 누르면 그때 원이 있던 자리에 흐린 원이 남습니다(입력 지연 반영): 끝에 남으면 박에 맞게 친 것입니다"></span>
        </span>
        <span class="spacer"></span>
        <button id="settingsBtn" title="악기 연결, 연습, 화면 설정">⚙</button>
        <button id="collapse" title="툴바 접기/펼치기">▲</button>
      </div>
      <div id="toolbarBody">
        <div class="bar">
          <label class="btn">MIDI 열기<input type="file" id="file" accept=".mid,.midi" hidden /></label>
          <span id="songName"></span>
          <span class="sep"></span>
          <label>조옮김 <select id="transpose"></select></label>
          <span class="sep"></span>
          <label><input type="checkbox" id="upcoming" checked /> 다음 버튼</label>
          <span class="sep"></span>
          <span class="group wide">
          <label title="켜면 노트를 칠 때까지 기다립니다. 놓친 음은 맞게 칠 때까지 그 자리에서 멈춥니다"><input type="checkbox" id="practice" /> 연습 모드</label>
          <label class="practice-only" title="연습 모드에서 베이스 음과 코드도 쳐야 넘어갑니다. 멜로디와 베이스가 함께 시작하는 곳은 둘 다 쳐야 진행합니다. 베이스 음은 같은 음을 내는 버튼(기본 베이스, 카운터) 어느 것이든, 코드는 그 코드 버튼이면 맞습니다."><input type="checkbox" id="waitBass" checked /> 베이스도 연습</label>
          <label class="practice-only" title="연습 모드에서 이 시간 안에 누르면 맞음으로 칩니다 (앞뒤)">판정 <input type="range" id="hitWindow" min="50" max="200" step="10" value="120" /></label>
          <span id="hitWindowLabel" class="mono practice-only">120ms</span>
          </span>
        </div>
      </div>
      <div id="settings" class="bar" hidden>
        <span class="group wide">
          <label>입력 <select id="midiIn"></select></label>
          <label title="악기 입력과 MIDI 출력에 쓰는 채널">채널 오른손 <select id="chRight"></select></label>
          <label>베이스 <select id="chBass"></select></label>
          <label>코드 <select id="chChord"></select></label>
          <span id="lastCh" class="muted"></span>
          <label title="악기 입력이 늦게 도착하는 만큼 판정을 앞당겨 맞춥니다">입력 지연 <input type="range" id="latency" min="0" max="300" step="5" value="0" /></label>
          <span id="latencyLabel" class="mono">0ms</span>
        </span>
        <span class="sep"></span>
        <span class="group wide">
          <label title="연습 모드에서 오른손 소리를 내 건반에 맞춥니다: 노트는 도착할 때 소리 나기 시작하고, 판정 안에서 맞게 치면 그 건반을 뗄 때 멈춥니다. 놓친 뒤나 틀린 음은 누르는 동안만 소리 납니다."><input type="checkbox" id="followInput" /> 내 연주로 소리</label>
        </span>
        <span class="sep"></span>
        <span class="group wide">
          <label><input type="checkbox" id="mirror" /> 위아래 반전</label>
          <label><input type="checkbox" id="mirrorX" /> 좌우 반전</label>
          <label><input type="checkbox" id="helpers" checked /> 4·5열 표시</label>
          <label><input type="checkbox" id="fitRange" /> 곡 음역만 표시</label>
          <label title="오른손 줄 사이 간격(버튼 간격 대비). 실제 버튼 배치는 약 0.87(√3/2)입니다">줄 간격 <input type="range" id="rowGap" min="0.35" max="0.9" step="0.01" value="0.5" /></label>
          <span id="rowGapLabel" class="mono">0.50</span>
        </span>
        <span class="sep"></span>
        <span class="group wide">
          <label><input type="checkbox" id="noteNames" checked /> 노트 음 이름</label>
          <label title="베이스 롤 레인을 C C# D … 순서로 (끄면 보드와 같은 5도 순서)"><input type="checkbox" id="bassChromatic" /> 베이스 반음 순서</label>
        </span>
        <span class="spacer"></span>
        <button id="resetPrefs" title="저장된 설정을 모두 지우고 기본값으로 시작">설정 초기화</button>
      </div>
    </header>
    <main>
      <canvas id="stage"></canvas>
      <div id="parts">
        <div class="track-head"><span>트랙</span><span title="트랙의 음을 낼 소리. 자동은 오른손·베이스 기본 음색">음색</span><span>볼륨</span><span title="오른손">오</span><span title="베이스">베</span></div>
        <div id="trackRows" class="track-rows"></div>
        <div class="part-row">
          <label title="오른손: 함께 시작하는 음 중 가장 높은 음만"><input type="checkbox" id="topLine" /> 최고음만</label>
          <label title="오른손: 건반 밖의 음을 옥타브 옮겨 맞춤"><input type="checkbox" id="fit" checked /> 음역 맞춤</label>
        </div>
      </div>
    </main>
    <div id="error" hidden title="오류가 났습니다. 클릭하면 닫힙니다"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
