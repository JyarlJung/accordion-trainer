<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // The layout needs 1280 px across. A smaller screen (a phone) lays the page out that wide and
      // scales it down to fit, so the page's height is the screen's too instead of a fixed minimum.
      if (Math.max(screen.width, screen.height) < 1280)
        document.querySelector('meta[name=viewport]').content = 'width=1280, viewport-fit=cover';
    </script>
    <title>Accordion Trainer</title>
    <meta name="theme-color" content="#1f1f26" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <header id="toolbar">
      <div class="bar transport">
        <button id="play" class="primary" title="Space">▶</button>
        <input type="range" id="seek" min="0" max="1000" value="0" data-i18n-title="seek.tip" />
        <span id="time" class="mono">0:00 / 0:00</span>
        <span class="sep"></span>
        <span class="cat" data-i18n-title="speed.tip">
          <span class="cat-title" data-i18n="speed">속도</span>
          <input type="range" id="rate" min="0.25" max="1.5" step="0.05" value="1" />
          <span id="rateLabel" class="mono">100%</span>
        </span>
        <span class="sep"></span>
        <span class="cat">
          <span class="cat-title" data-i18n="metronome" data-i18n-title="metronome.tip">메트로놈</span>
          <input type="range" id="metronome" min="0" max="1" step="0.1" value="0" data-i18n-title="metronome.tip" />
          <select id="metronomeUnit" data-i18n-title="metronomeUnit.tip">
            <option value="half" data-i18n="unit.half">2분</option>
            <option value="quarter" selected data-i18n="unit.quarter">4분</option>
            <option value="eighth" data-i18n="unit.eighth">8분</option>
          </select>
          <span id="beatSwing" data-i18n-title="beatSwing.tip"></span>
        </span>
        <span class="spacer"></span>
        <span class="menu-anchor">
          <button id="settingsBtn" data-i18n-title="settings.tip">⚙</button>
          <div id="settings" class="menu" hidden>
            <div class="menu-group">
              <span class="cat-title" data-i18n="midiInput">MIDI 입력</span>
              <label><span data-i18n="input">입력</span> <select id="midiIn"></select></label>
              <span class="group">
                <label data-i18n-title="channels.tip"><span data-i18n="channelRight">채널 오른손</span> <select id="chRight"></select></label>
                <label><span data-i18n="bass">베이스</span> <select id="chBass"></select></label>
                <label><span data-i18n="chord">코드</span> <select id="chChord"></select></label>
              </span>
              <span id="lastCh" class="muted"></span>
              <span class="group">
                <label data-i18n-title="latency.tip"><span data-i18n="latency">입력 지연</span> <input type="range" id="latency" min="0" max="300" step="5" value="0" /></label>
                <span id="latencyLabel" class="mono">0ms</span>
              </span>
            </div>
            <div class="menu-group">
              <span class="cat-title" data-i18n="keyboardLayout">건반 배열</span>
              <label data-i18n-title="rightLayout.tip"><span data-i18n="rightHand">오른손</span> <select id="rightLayout">
                <option value="c" data-i18n="layout.c">C 시스템</option>
                <option value="b" data-i18n="layout.b">B 시스템 (바얀)</option>
                <option value="piano" data-i18n="layout.piano">피아노 건반</option>
              </select></label>
              <label class="button-only"><input type="checkbox" id="helpers" /> <span data-i18n="helpers">4·5열 표시</span></label>
              <span class="group button-only">
                <label data-i18n-title="rowGap.tip"><span data-i18n="rowGap">줄 간격</span> <input type="range" id="rowGap" min="0.35" max="0.9" step="0.01" value="0.5" /></label>
                <span id="rowGapLabel" class="mono">0.50</span>
              </span>
              <span class="group piano-only" data-i18n-title="pianoRange.tip">
                <span data-i18n="pianoRange">범위 지정</span>
                <span id="pianoLowLabel" class="mono range-note">F3</span>
                <span class="dual-range">
                  <span class="dual-track"></span>
                  <span id="pianoRangeFill" class="dual-fill"></span>
                  <input type="range" id="pianoLow" min="21" max="108" step="1" value="53" />
                  <input type="range" id="pianoHigh" min="21" max="108" step="1" value="93" />
                </span>
                <span id="pianoHighLabel" class="mono range-note">A6</span>
              </span>
            </div>
            <div class="menu-group">
              <span class="cat-title" data-i18n="display">화면</span>
              <label data-i18n-title="upcoming.tip"><input type="checkbox" id="upcoming" checked /> <span data-i18n="upcoming">다음 누를 버튼 표시</span></label>
              <label><input type="checkbox" id="mirror" /> <span data-i18n="mirror">위아래 반전</span></label>
              <label><input type="checkbox" id="mirrorX" /> <span data-i18n="mirrorX">좌우 반전</span></label>
              <label><input type="checkbox" id="noteNames" checked /> <span data-i18n="noteNames">노트에 음 이름 표시</span></label>
              <label data-i18n-title="lowLatency.tip"><span data-i18n="lowLatency">저지연 그리기</span> <select id="lowLatency">
                <option value="auto" data-i18n="lowLatency.auto">자동</option>
                <option value="on" data-i18n="lowLatency.on">켜기</option>
                <option value="off" data-i18n="lowLatency.off">끄기</option>
              </select></label>
              <label data-i18n-title="rateUnit.tip"><span data-i18n="rateUnit">속도 표시</span> <select id="rateUnit">
                <option value="percent">%</option>
                <option value="bpm">BPM</option>
              </select></label>
              <label data-i18n-title="bassChromatic.tip"><input type="checkbox" id="bassChromatic" /> <span data-i18n="bassChromatic">베이스를 반음 순서로 표시</span></label>
            </div>
            <div class="menu-group">
              <span class="cat-title" data-i18n="sound">소리</span>
              <label data-i18n-title="defaultVoice.tip"><span data-i18n="defaultVoice">기본 음색</span> <select id="defaultVoice"></select></label>
            </div>
            <div class="menu-group">
              <span class="cat-title">언어 · Language</span>
              <select id="language">
                <option value="auto" data-i18n="lang.auto">자동 (시스템 언어)</option>
                <option value="ko">한국어</option>
                <option value="en">English</option>
              </select>
            </div>
            <div class="menu-foot">
              <button id="resetPrefs" data-i18n="resetPrefs" data-i18n-title="resetPrefs.tip">설정 초기화</button>
            </div>
          </div>
        </span>
      </div>
      <div id="toolbarBody">
        <div class="bar">
          <span class="cat">
            <span class="cat-title" data-i18n="pitch">음높이</span>
            <label><span data-i18n="transpose">조옮김</span> <select id="transpose"></select></label>
          </span>
          <span class="sep"></span>
          <span class="cat">
            <span class="cat-title" data-i18n="practice" data-i18n-title="practice.tip">연습 모드</span>
            <label data-i18n-title="practiceRight.tip"><input type="checkbox" id="practiceRight" /> <span data-i18n="rightHand">오른손</span></label>
            <label data-i18n-title="practiceBass.tip"><input type="checkbox" id="practiceBass" /> <span data-i18n="bass">베이스</span></label>
            <span class="group practice-only">
              <label data-i18n-title="hitWindow.tip"><span data-i18n="hitWindow">판정</span> <input type="range" id="hitWindow" min="50" max="200" step="10" value="120" /></label>
              <span id="hitWindowLabel" class="mono">120ms</span>
            </span>
            <label class="practice-only" data-i18n-title="chordNeed.tip"><span data-i18n="chordNeed">화음 통과</span> <select id="chordNeed">
              <option value="" data-i18n="chordNeed.all">모두</option>
              <option value="1" data-i18n="chordNeed.n1">1음</option>
              <option value="2" data-i18n="chordNeed.n2">2음</option>
            </select></label>
            <label class="practice-only" data-i18n-title="followInput.tip"><input type="checkbox" id="followInput" /> <span data-i18n="followInput">내 연주로 소리내기</span></label>
          </span>
          <span class="sep"></span>
          <span class="cat" data-i18n-title="loop.tip">
            <span class="cat-title" data-i18n="loop">구간 반복</span>
            <button id="loopA" data-i18n-title="loopA.tip">A</button>
            <button id="loopB" data-i18n-title="loopB.tip">B</button>
          </span>
          <span class="spacer"></span>
          <a id="about" class="about" href="https://github.com/JyarlJung/accordion-trainer" target="_blank" rel="noopener" data-i18n-title="about.tip">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
            <span id="version" class="mono"></span>
          </a>
        </div>
      </div>
    </header>
    <main>
      <div id="stageBox"><canvas id="stage"></canvas></div>
      <div id="parts" class="empty">
        <div class="song-bar">
          <span id="songName"></span>
          <button id="openOther" data-i18n="openOther" data-i18n-title="openOther.tip">다른 곡 열기</button>
        </div>
        <div class="track-head">
          <span data-i18n="tracks.track">트랙</span>
          <span data-i18n="tracks.voice" data-i18n-title="tracks.voice.tip">음색</span>
          <span data-i18n="tracks.octave" data-i18n-title="tracks.octave.tip">옥타브</span>
          <span data-i18n="tracks.volume">볼륨</span>
          <span class="head-icon" data-i18n-title="tracks.mute"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path d="M11 6l4 4M15 6l-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
          <span class="head-treble" data-i18n="tracks.right.short" data-i18n-title="tracks.right.tip">오</span>
          <span class="head-bass" data-i18n="tracks.bass.short" data-i18n-title="tracks.bass.tip">베</span>
        </div>
        <div id="trackRows" class="track-rows"></div>
        <!-- for="file": otherwise the label would act for its first labelable child, the sample button -->
        <label class="drop-zone" for="file">
          <span class="btn" data-i18n="openMidi">MIDI 파일 열기</span>
          <span class="muted" data-i18n="dropMidi">또는 MIDI 파일을 여기로 끌어다 놓으세요</span>
          <button id="openSample" data-i18n="openSample" data-i18n-title="openSample.tip">샘플 곡 열기 (Greensleeves)</button>
          <input type="file" id="file" accept=".mid,.midi" hidden />
        </label>
      </div>
    </main>
    <div id="error" hidden data-i18n-title="error.tip"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
