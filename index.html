<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accordion Trainer</title>
  </head>
  <body>
    <header id="toolbar">
      <div class="bar transport">
        <button id="play" class="primary" title="Space">▶</button>
        <input type="range" id="seek" min="0" max="1000" value="0" />
        <span id="time" class="mono">0:00 / 0:00</span>
        <span class="sep"></span>
        <label>속도 <input type="range" id="rate" min="0.25" max="1.5" step="0.05" value="1" /></label>
        <span id="rateLabel" class="mono">100%</span>
        <span class="group">구간
          <button id="loopA" title="구간 시작">A</button>
          <button id="loopB" title="구간 끝">B</button>
          <button id="loopClear" title="구간 해제">✕</button>
          <select id="loopUnit" title="구간을 맞출 단위">
            <option value="bar">마디</option>
            <option value="beat">박</option>
          </select>
        </span>
        <select id="mode">
          <option value="play">재생 모드</option>
          <option value="wait">기다리기 모드</option>
        </select>
        <label>볼륨 <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" /></label>
        <span id="volumeLabel" class="mono">80%</span>
        <span class="spacer"></span>
        <button id="settingsBtn" title="음색, 악기 연결, 화면 방향 설정">⚙</button>
        <button id="collapse" title="툴바 접기/펼치기">▲</button>
      </div>
      <div id="settings" class="bar" hidden>
        <label>음색 <select id="output"></select></label>
        <label>입력 <select id="midiIn"></select></label>
        <span id="lastCh" class="muted"></span>
        <label title="악기의 Ext Seq(아코디언)를 켜 둔 경우, 직접 누른 오른손 연주를 악기로 되돌려 소리 나게 합니다"><input type="checkbox" id="thru" checked /> 내 연주 되돌리기</label>
        <span class="sep"></span>
        <label><input type="checkbox" id="mirror" /> 위아래 반전</label>
        <label><input type="checkbox" id="mirrorX" /> 좌우 반전</label>
        <span class="spacer"></span>
        <button id="resetPrefs" title="저장된 설정을 모두 지우고 기본값으로 시작">설정 초기화</button>
      </div>
      <div id="toolbarBody">
        <div class="bar">
          <label class="btn">MIDI 열기<input type="file" id="file" accept=".mid,.midi" hidden /></label>
          <span id="songName"></span>
          <label title="이 음 이상은 오른손, 아래는 베이스로 나눕니다 (두 파트가 같은 트랙을 쓸 때)">분할 <select id="split"></select></label>
          <label>조옮김 <select id="transpose"></select></label>
          <span class="sep"></span>
          <label><input type="checkbox" id="helpers" checked /> 4·5열</label>
          <label><input type="checkbox" id="fitRange" /> 곡 음역만</label>
          <label><input type="checkbox" id="upcoming" checked /> 다음 버튼</label>
          <label>줄 간격 <input type="range" id="rowGap" min="0.35" max="0.9" step="0.05" value="0.5" /></label>
          <span id="rowGapLabel" class="mono">0.50</span>
          <label title="이 시간 안에 누르면 맞음으로 칩니다 (앞뒤)">판정 <input type="range" id="hitWindow" min="50" max="200" step="10" value="120" /></label>
          <span id="hitWindowLabel" class="mono">120ms</span>
        </div>
      </div>
    </header>
    <main>
      <canvas id="stage"></canvas>
      <section id="treblePanel" class="part">
        <div class="part-row">
          <b>오른손</b>
          <label><input type="checkbox" id="sound" checked /> 소리</label>
          <label title="악기 입력과 MIDI 출력에 쓰는 채널">ch <select id="chRight"></select></label>
        </div>
        <div id="trebleTracks" class="tracks"></div>
        <div class="part-row">
          <label><input type="checkbox" id="topLine" /> 최고음만</label>
          <label><input type="checkbox" id="fit" checked /> 음역 맞춤</label>
        </div>
      </section>
      <section id="bassPanel" class="part">
        <div class="part-row">
          <b>베이스</b>
          <label><input type="checkbox" id="bassSound" checked /> 소리</label>
          <label title="악기 입력과 MIDI 출력에 쓰는 채널">ch <select id="chBass"></select></label>
          <label title="악기가 코드 버튼을 보내는 채널">코드 ch <select id="chChord"></select></label>
        </div>
        <div id="bassTracks" class="tracks"></div>
        <div class="part-row muted">가장 낮은 음만 · 판정 없음</div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
